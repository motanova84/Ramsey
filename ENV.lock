# Environment Lock File for Ramsey Formal Verification Project
# This file ensures reproducibility across different environments
# Generated: 2026-01-06
# Format version: 1.0

[meta]
format_version = "1.0"
generated_at = "2026-01-06T21:50:00Z"
purpose = "Ensure reproducibility of Ramsey formal verification results"

[system_requirements]
# Minimum system requirements for running the project
os = "Linux, macOS, Windows WSL2"
cpu_cores = "4+"
memory_gb = "8+"
disk_space_gb = "10+"

[python]
# Python environment specification
version = "3.10+"
recommended = "3.12.3"
package_manager = "pip"
# Use requirements-lock.txt for exact package versions
lock_file = "requirements-lock.txt"
# Core dependencies with version ranges
dependencies = [
    "z3-solver==4.15.4.0",
    "numpy==2.3.5",
    "fire==0.7.1",
    "openai==2.8.1",
    "matplotlib==3.10.7",
    "click==8.3.1",
]

[lean]
# Lean 4 formal verification environment
version = "4.3.0"
toolchain = "leanprover/lean4:v4.3.0"
toolchain_file = "lean-toolchain"
package_manager = "lake"
# Mathlib dependency is managed by lakefile.lean
mathlib = "latest compatible with Lean 4.3.0"

[nodejs]
# Node.js for NFT/Web3 integration
version = "18+"
recommended = "20.19.6"
package_manager = "npm"
lock_file = "package-lock.json"

[solvers]
# SAT/SMT solvers used for verification
[solvers.z3]
version = "4.12.2+"
recommended = "4.15.4.0"
source = "pip install z3-solver==4.15.4.0"
purpose = "SAT/SMT solving for Ramsey verification"

[solvers.kissat]
version = "any"
optional = true
source = "https://github.com/arminbiere/kissat"
purpose = "Alternative SAT solver for performance comparison"

[data_integrity]
# SHA256 checksums for critical verification data files
# These ensure data has not been corrupted or tampered with
[data_integrity.checksums]
"data/rpsi_vibration_model.json" = "539f00a7d61c9c589d1b7adeb4c9856c8de00122c98a764fe7bc3ff47eff93bb"
"data/verified_bound_R55.json" = "5af48aa1d3c95e2c476673285a7376e323778e48c34f8b41470c874f00343703"
"data/coloring_sat_r55.cnf" = "5a068fae1103679585aea053c6827cc7d8acb810595f7ac5826d2aa9bac242e2"
"data/r66.cnf" = "78aad3170abe2d34241288056fab8655759612c3150f128df92b376c80df9e4e"
"data/rpsi_5_5_n16.cnf" = "e73256aaa26852e8737d4b76a52542564928aeaa0360f97a4ea73b1962b0dfc6"

[data_integrity.critical_files]
# Files critical for reproducibility
beacon = ".qcal_beacon"
beacon_r33 = ".qcal_beacon_r33"
beacon_r44 = ".qcal_beacon_r44"
beacon_r66 = ".qcal_beacon_r66"
beacon_r88 = ".qcal_beacon_r88"

[verification_parameters]
# Key parameters that must remain constant for reproducibility
f0_frequency_hz = 141.7001
epsilon_threshold = 0.001
grid_size = 128
ramsey_r = 5
ramsey_s = 5
classical_bound = 43
vibrational_bound = 43

[ci_cd]
# CI/CD pipeline configuration
workflows = [".github/workflows/ci.yml", ".github/workflows/lean-ci.yml"]
required_checks = ["test-python", "build-lean", "validate-qcal"]
python_version_ci = "3.10"
lean_cache_enabled = true

[reproducibility_checklist]
# Steps to ensure reproducibility
steps = [
    "1. Clone repository from GitHub",
    "2. Check environment matches ENV.lock specifications",
    "3. Install Python dependencies from requirements-lock.txt",
    "4. Install Lean toolchain version from lean-toolchain file",
    "5. Verify data file checksums using verify_integrity.py",
    "6. Run build_and_verify.sh to build Lean proofs",
    "7. Run run_tests.py to execute Python tests",
    "8. Verify .qcal_beacon signature matches expected values",
]

[security]
# Security considerations
dependency_scanning = "enabled"
secret_detection = "enabled"
code_scanning = "recommended"
audit_frequency = "monthly"
# Run: pip-audit to check for known vulnerabilities
# Run: npm audit for Node.js dependencies
security_contacts = ["See SEGURIDAD.md for security policy"]

[notes]
# Additional notes for maintainers
comment_1 = "This file should be updated whenever environment dependencies change"
comment_2 = "Regenerate checksums after modifying data files: sha256sum data/*.json data/*.cnf > checksums.txt"
comment_3 = "For Lean dependencies, lake.manifest.json is auto-generated - do not edit manually"
comment_4 = "Python dependencies: edit requirements.in, then run: pip-compile requirements.in -o requirements-lock.txt"
