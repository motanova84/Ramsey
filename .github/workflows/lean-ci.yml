name: Lean 4 CI

on:
  push:
    branches: [ main, copilot/** ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and verify Lean proofs
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install elan
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
        echo "$HOME/.elan/bin" >> $GITHUB_PATH
    
    - name: Cache Lean dependencies
      uses: actions/cache@v3
      with:
        path: |
          .lake
          lake-packages
        key: ${{ runner.os }}-lean-${{ hashFiles('lakefile.lean', 'lean-toolchain') }}
        restore-keys: |
          ${{ runner.os }}-lean-
    
    - name: Build Lean project
      run: lake build
      continue-on-error: true
    
    - name: List certificates
      run: |
        echo "📜 Available certificates:"
        ls -la certificates/ || echo "No certificates found"
  
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: python test_ramsey.py
    
    - name: Test CLI tool
      run: |
        python ai_ramsey_formal.py --help
        python ai_ramsey_formal.py list
  
  benchmark:
    name: Run benchmark
    runs-on: ubuntu-latest
    needs: python-tests
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run benchmark
      run: python ai_ramsey_formal.py benchmark
      timeout-minutes: 10
