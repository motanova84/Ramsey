name: Ramsey Formal CI

on:
  push:
    branches: [ main, master, copilot/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-python:
    name: Test Python Components
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Python tests
      run: |
        python run_tests.py
    
    - name: Test CLI tool
      run: |
        pip install -e .
        ai-ramsey-formal --help
        python ai-ramsey-formal/cli.py certify 3 3 --output /tmp/certs

  build-lean:
    name: Build Lean Proofs
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Lean toolchain
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
        echo "$HOME/.elan/bin" >> $GITHUB_PATH
    
    - name: Cache Lake dependencies
      uses: actions/cache@v3
      with:
        path: |
          .lake
          lake-packages
        key: ${{ runner.os }}-lean-${{ hashFiles('lakefile.lean') }}
        restore-keys: |
          ${{ runner.os }}-lean-
    
    - name: Build Lean project
      run: |
        lake update
        lake build
    
    - name: Check Lean files
      run: |
        lake env lean --version
        echo "✓ Lean build successful"

  formal-verification:
    name: Formal Verification Status
    needs: [test-python, build-lean]
    runs-on: ubuntu-latest
    
    steps:
    - name: Verification Complete
      run: |
        echo "✅ All formal verification checks passed"
        echo "Badge: Formal Proof Passed"
